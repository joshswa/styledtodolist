<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link href="styles.css" rel="stylesheet"></link>
</head>

<body>
    <div class="container">
        <h1>My Lists of TODO's </h1>
        <ul class="todo-list">
            <li><input id="li1" type="checkbox">
                <label for="li1">Explore gaming keyboards</label>
                <ul class="sub-item">
                        <li><a class="sub-item-link" href="nothingwebsites.com" target="_blank">Store link</a></li>
                </ul>
            </li>
            <li><input id="li2" type="checkbox">
                <label for="li2">Finish the report</label>
                <ul class="sub-item">
                        <li><a class="sub-item-link" href="nothingwebsites.com" target="_blank">Request Access</a></li>
                </ul>
            </li>
            <li><input id="li3" type="checkbox">
                <label for="li3">View Phone's Warranty</label>
                <ul class="sub-item">
                        <li><a class="sub-item-link" href="nothingwebsites.com" target="_blank">View Receipts</a></li>
                </ul>
            </li>
            <li><input id="li4" type="checkbox">
                <label for="li4">Check Processor Specs</label>
                <ul class="sub-item">
                        <li><a class="sub-item-link" href="nothingwebsites.com" target="_blank">View Model Number</a></li>
                </ul>
            </li>
        </ul>
    </div>
</body>
</html>
